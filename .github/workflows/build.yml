name: Build and core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: brew install libusb openjdk@17
      - run: brew install --cask android-commandlinetools
      - run: swift run CoreChecks
      - name: Build Android companion and UHID helper
        run: |
          export JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager "platforms;android-35" "build-tools;35.0.0"
          bash scripts/build-android.sh
      - run: bash scripts/build-app.sh
